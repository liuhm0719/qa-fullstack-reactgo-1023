server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Path-based routing forwards the FULL /{project}/{component} prefix
  # (never stripped); peel the two leading segments so asset paths resolve
  # against the dist root, then fall back to the SPA entry.
  location / {
    rewrite ^/[^/]+/[^/]+/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
}
